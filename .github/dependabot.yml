version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    reviewers:
      - "ashleykleynhans"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # 1.27+ requires CUDA 13; this worker stays on the CUDA 12.4.1 base image
      - dependency-name: "onnxruntime"
        versions: [">=1.27.0"]
      - dependency-name: "onnxruntime-gpu"
        versions: [">=1.27.0"]

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 3
    reviewers:
      - "ashleykleynhans"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 3
    reviewers:
      - "ashleykleynhans"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
